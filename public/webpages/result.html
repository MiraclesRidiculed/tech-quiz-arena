<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Quiz Outro</title>
	<link rel="stylesheet" href="../css/result.css">
	<script src="../js/api.js" defer></script>
	<script src="../js/result.js" defer></script>
</head>

<body>
	<div class="container">

		<h1>Quiz Completed</h1>

		<h2>Stats:</h2>
		<table class="stats" border="5" cellpadding="20" cellspacing="5" align="center">
				<tr align="center">
					<th>Time Started</th>
					<td id="timeStarted"></td>
				</tr>
				<tr align="center">
					<th>Time Ended</th>
					<td id="timeEnded"></td>
				</tr>
				<tr align="center">
					<th>Duration</th>
					<td id="duration"></td>
				</tr>
				<tr align="center">
					<th>Score</th>
					<td id="score"></td>
				</tr>
			</table>

		<p id="instructions" class="instructions"></p>

		<p class="thank-you">Thank you for participating in Crackathon! Kindly alert a coordinator for further instructions.</p>
	</div>
</body>

</html>
